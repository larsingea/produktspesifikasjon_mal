      Bokstaven og de to første tallene angir hvilken etasje leiligheten ligger i,
      og de to siste angir leilighetens nummer i etasjen, regnet fra venstre mot høyre.

      <etasjeplan><etasjenummer><lopenummer>

      Eksempel: "H0102", "K0101"'
