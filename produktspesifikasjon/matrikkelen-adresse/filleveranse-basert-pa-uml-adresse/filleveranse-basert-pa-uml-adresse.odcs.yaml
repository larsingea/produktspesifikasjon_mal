      description: 'nummerering av kommuner i henhold til Statistisk sentralbyrå sin
        offisielle liste


        Merknad: Det presiseres at kommune alltid skal ha 4 siffer, dvs. eventuelt
        med ledende null. Kommune benyttes for kopling mot en rekke andre registre
        som også benytter 4 siffer.'
      required: true
    - name: seksjonsnummer
      logicalType: integer
      description: Fortløpende nummerering av seksjoner under gårdsnummer/bruksnummer
        og eventuelt festenummer.
    description: 'entydig identifisering av matrikkelenhet innen kommune, definert
      i matrikkelforskrift § 7e


      Merknad (teknisk): Hentes fra adresse (link til matrikkelenhet fra adresse i
      matrikkelen)'
    required: true
  - name: postnummerområde
    logicalType: object
    properties:
    - name: postnummer
      logicalType: string
      description: 'firesifret kode som identifiserer et postnummerområde


        Merknad: Det første sifferet angir postsone, de to første sifrene angir postregion,
        de tre første sifrene angir postområde og alle fire sifrene angir postnummerområde/poststed.'
      required: true
    - name: poststed
      logicalType: string
      description: navn på poststed i henhold til Postens egne lister
    description: adressens knytning til postnummerområde, geografisk område med felles
      postnummer, og en underinndeling av postområde
    required: true
  - name: representasjonspunkt
    logicalType: string
    description: 'Representasjonspunkt for adressen. Angir normalt atkomsten til en
      bygning, bolig eller andre objekter og steder.


      Merknad:

      Dersom en adresse kun gjelder en bygning med en adresse, plasseres punktet innenfor
      bygningens omriss like ved inngang /atkomst.

      Det samme gjelder dersom det er knyttet flere adresser til flere innganger/atkomster
      til en bygning. Adressepunktene plasseres like ved de respektive innganger/atkomster
      innenfor bygningens omriss. For bygg med altangang eller svalgang med atkomst
      til den enkelte bolig via utvendig atkomsttrapp, plasseres adressepunktet i
      trapp nærmest terrengnivå


      For ubebygde eiendommer verifiseres det at punktet er innenfor teigen og ved
      atkomst.'
    required: true
  - name: sokn
    logicalType: object
    properties:
    - name: organisasjonsnummer
      logicalType: integer
      description: entydig identifisering av foretak i Brønnøysundregisteret
      required: true
    - name: soknenavn
      logicalType: string
      description: navn på soknet
    - name: soknenummer
      logicalType: string
      description: 'unik identifikasjon av et sokn i form av 8-sifre


        Merknad:

        De to første siffer står for bispedømme, to neste for prosti, to neste for
        prestegjeld (utgått, men inngår i nummerering) og to siste for sokn.'
    description: 'adressens kobling til sokn, den minste geistlige enheten og bestyres
      av en sokneprest


      Merknad:

      Folket som er medlem i Den norske kirke og bosatt innenfor et sokn betegnes
      som menighet.'
    required: true
  - name: tettsted
    logicalType: object
    properties:
    - name: tettstednavn
      logicalType: string
      description: navn på tettsted bestemt av SSB
    - name: tettstednummer
      logicalType: string
      description: 'består av en 4-sifret kode


        Merknad: Det skal benyttes ledende nuller.'
      required: true
    description: 'adressens tilknytning til tettsted, område hvor det bor minst 200
      personer, og avstanden mellom husene normalt ikke overstiger 50 meter (SSB)


      Merknad:

      Hussamlinger som naturlig  hører med til tettstedet, tas med inntil en avstand
      på 400 meter fra tettstedskjernen.'
  - name: valgkrets
    logicalType: object
    properties:
    - name: valgkretsnavn
      logicalType: string
      description: navn til valgkrets
    - name: valgkretsnummer
      logicalType: string
      description: løpenummer innenfor valgkretsens kommune
      required: true
    description: 'adressens knytning til valgkrets, valgkretsene har som formål å
      være en hensiktsmessig inndeling av kommuner ved valg, bl.a. for at velgerne
      ikke skal få for stor avstand til valglokalet


      Merknad: Inndelingen skal ivareta administrative formål, men har også i en viss
      grad blitt nyttet til å samle inn statistikk for planleggingsformål.'
    required: true
  - name: adressekode
    logicalType: integer
    description: 'Et nummer som entydig identifiserer adresserbare gater, veger, stier,
      plasser og områder som er ført i matrikkelen. For hvert adressenavn skal det
      således foreligge en adressekode, jf. matrikkelforskriften § 51.2.

      Merknad: Adressekode er unik innenfor kommunen


      Merknad (teknisk): Avledet fra Veg-objektet'
    required: true
  - name: adressenavn
    logicalType: string
    description: 'Navn på gate, veg, sti, plass eller område som er ført i matrikkelen.
      (matrikkelforskriften § 2e)


      Merknad (teknisk): Avledet fra Veg-objektet'
    required: true
  - name: bokstav
    logicalType: string
    description: 'del av adressenummer (jfr Matrikkelforskrift § 2f).


      Ved behov kan det i tillegg til tallet brukes en etterfølgende bokstav. Bokstav
      skal bare brukes for å unngå omnummerering i tidligere tildelte adresser. Bokstav
      skal gis i alfabetisk rekkefølge. (matrikkelforskrift § 52 tredje ledd).


      Merknad: Høyst en bokstav'
  - name: nummer
    logicalType: integer
    description: 'Del av adressenummer som er definert slik i matrikkelforskrift:


      et nummer og en eventuell bokstav (husnummer) som entydig identifiserer eiendommer,
      anlegg, bygninger eller innganger til bygninger innenfor en adresserbar gate,
      veg, sti, plass eller område (Forskrift § 2f).'
    required: true
- name: Matrikkeladresse
  physicalName: matrikkeladresse
  logicalType: object
  physicalType: table
  description: 'offisiell adresse i form av et gårds- og bruksnummer og eventuelt
    et festenummer, eventuelt også et undernummer (Matrikkelforskriften § 2j)


    Merknad:

    Matrikkeladresse er adresseidentifikasjon i et område der det ikke er tildelt
    vegadresse.


    Merknad2: Eventuelle bruksenhetsnummer som del av offisiell adresse kan ligge
    som egenskaper til matrikkeladressen


    Merknad3: Seksjonsnummer er ikke en del av den logiske identen for matrikkeladresse,
    - se egenskapen adressetekst.'
  customProperties:
  - property: sosiObjektType
    value: Matrikkeladresse
  - property: inheritsFrom
    value: Adresse
  properties:
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.


        NOTE: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til objektet, starter
        med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom data
        produsenten ikke er assosiert med bare et land.


        NOTE 1 : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og vil registreres i "INSPIRE external  Object
        Identifier Namespaces Register"


        Eksempel: NO for Norge.'
      required: true
    - name: versjonId
      logicalType: string
      description: 'identifikasjon av en spesiell versjon av et geografisk objekt
        (instans), maksimum lengde på 25 karakterers. Dersom spesifikasjonen av et
        geografisk objekt med en identifikasjon inkludererer livsløpssyklusinformasjon,
        benyttes denne versjonId for å skille mellom ulike versjoner av samme objekt.
        versjonId er en unik  identifikasjon av versjonen.


        NOTE Maksimum lengde er valgt for å tillate tidsregistrering i henhold til  ISO
        8601, slik som  "2007-02-12T12:12:12+05:30" som versjonId.'
    description: unik identifikasjon av et objekt
    required: true
  - name: oppdateringsdato
    logicalType: timestamp
    description: 'dato for siste endring på objektetdataene


      Merknad:

      Oppdateringsdato kan være forskjellig fra Datafangsdato ved at data som er registrert
      kan bufres en kortere eller lengre periode før disse legges inn i datasystemet
      (databasen).


      -Definition-

      Date and time at which this version of the spatial object was inserted or changed
      in the spatial data set.'
    required: true
  - name: stedfestingVerifisert
    logicalType: boolean
    description: angivelse om stedfestingen (koordinatene) er  kontrollert  og funnet
      i orden (verifisert)
    required: true
  - name: adresseTekst
    logicalType: string
    description: '<font color="#0f0f0f">Del av offisiell adresse, men uten bruksenhetsnummer
      for adresser som ligger til bruksenheter/boliger</font>


      Vegadresse:

      <ev adressetilleggsnavn>, <adressenavn> <nummer><ev bokstav>

      ev= hvis fins. Hvis ikke skal formateringstegn utgå foran/bak.

      <font color="#0f0f0f">

      </font><font color="#0f0f0f">Matrikkeladresse:</font>

      <ev adressetilleggsnavn>, <gardsnummer>/<bruksnummer>/<ev festenummer>-<ev undernummer>

      ev= hvis fins. Hvis ikke skal formateringstegn utgå foran/bak.

      <font color="#0f0f0f">

      </font><font color="#0f0f0f">Eksempel:  </font>

      <font color="#0f0f0f">"Storgata 2B" eller "123/4-2"</font>

      <font color="#0f0f0f">Der det i tillegg er adressetilleggsnavn:</font>

      <font color="#0f0f0f">"Haugen, Storgata 2B" eller "Midtgard, 123/4-2"</font>

      <font color="#0f0f0f">

      </font>Merknad:

      Adressene er unike innenfor en kommune.


      Merknad2: Adressetilleggsnavn av typen "Matrikkeladressenavn" kan inneholde
      andre ting enn adressetilleggsnavn'
    required: true
  - name: adresseTekstUtenAdressetilleggsnavn
    logicalType: string
    description: '<font color="#0f0f0f">Del av offisiell adresse, men uten bruksenhetsnummer
      for adresser som ligger til bruksenheter/boliger, - og uten eventuelle adressetilleggsnavn</font>

      <font color="#0f0f0f">

      </font>Vegadresse:

      <adressenavn> <nummer><ev bokstav>

      ev= hvis fins. Hvis ikke skal formateringstegn utgå foran/bak.

      <font color="#0f0f0f">

      </font><font color="#0f0f0f">Matrikkeladresse:</font>

      <gardsnummer>/<bruksnummer>/<ev festenummer>-<ev undernummer>

      ev= hvis fins. Hvis ikke skal formateringstegn utgå foran/bak.

      <font color="#0f0f0f">

      </font><font color="#0f0f0f">Eksempel: </font>

      <font color="#0f0f0f">"Fjellvegen 2B" eller "12/4"</font>

      <font color="#0f0f0f">"Storgata 3" eller "12/5/3-2"</font>'
    required: true
  - name: adressetilleggsnavn
    logicalType: string
    description: '<font color="#0f0f0f">Nedarvet bruksnavn, navn på en institusjon
      eller bygning eller grend brukt som del av den offisielle adressen</font>

      <font color="#0f0f0f">

      </font><font color="#0f0f0f">Merknad:</font>

      Eier kan kreve og kommunen kan tildele adressetilleggsnavn til en offisiell
      adresse etter vilkår i matrikkelforskriften § 54  og § 55. Hvilken regel den
      er tildelt etter skal registreres i matrikkelen (adressetilleggsnavnkilde)'
  - name: adressetilleggsnavnKilde
    logicalType: string
    logicalTypeOptions:
      pattern: ^(anmodetAvHjemmelshaver|ikkeOppgitt|krevdAvEier|matrikkeladressenavn|tildeltAvKommunen)$
    customProperties:
    - property: allowedValues
      value:
      - value: anmodetAvHjemmelshaver
        label: <font color="#333333">Når adressen gjelder en særlig kjent institusjon
          eller bygning og allmenne hensyn taler for det, kan kommunen på anmodning
          fra registrert eier fastsette at den offisielle adressen også skal omfatte
          et navn på institusjonen eller bygningen (</font>matrikkelforskriftens §
          54 2. ledd)
      - value: ikkeOppgitt
        label: '"Ikke oppgitt" brukes på adresser uten adressetilleggsnavn.'
      - value: krevdAvEier
        label: <font color="#333333">Når adressen gjelder et gårdsbruk, kan den som
          har grunnbokshjemmel til eiendommen som eier, kreve at den offisielle adressen
          også skal omfatte gårdens bruksnavn, dersom navnet faller språklig og geografisk
          sammen med et nedarvet stedsnavn, jf. lov 18. mai 1990 nr. 11 om stadnamn
          (</font>matrikkelforskriftens § 54 1. ledd)
      - value: matrikkeladressenavn
        label: <font color="#333333">Adresser i område med matrikkeladresser som ikke
          har tildelt et adressetilleggsnavn etter reglene i § 54, kan tilordnes et
          matrikkeladressenavn etter </font>matrikkelforskriftens § 55 3. ledd. Hvis
          det tildeles adressetilleggsnavn etter § 54 strykes matrikkeladressenavnet
      - value: tildeltAvKommunen
        label: <font color="#333333">Kommunen kan tildele adresser innenfor mindre
          grender, bolig- eller hyttefelt eller andre avgrensede områder et felles
          adressetilleggsnavn (</font>Matrikkelforskriftens § 54 3. ledd, men tildeling
          etter 1. eller 2. ledd går foran 3. ledd)
