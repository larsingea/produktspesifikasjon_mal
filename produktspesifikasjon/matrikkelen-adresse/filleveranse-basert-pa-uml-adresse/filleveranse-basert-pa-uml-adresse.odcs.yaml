    description: 'nummerering av kommunen i henhold til Statistisk sentralbyrå sin
      offisielle liste


      Merknad: Det presiseres at kommunenummer alltid skal ha 4 siffer, dvs. eventuelt
      med ledende null.'
    required: true
  - name: matrikkelnummerAdresse
    logicalType: object
    properties:
    - name: bruksnummer
      logicalType: integer
      description: Hver gård er delt opp i et eller flere bruk. Neste ledige bruksnummer
        innen et gårdsnummer tildeles automatisk. Forkortelsen er bnr
      required: true
    - name: festenummer
      logicalType: integer
      description: Fortløpende nummerering av fester under gårdsnummer/bruksnummer.
        Forkortelsen er fnr
    - name: gardsnummer
      logicalType: integer
      description: En kommune er delt inn i flere gårder, og alle matrikkelenheter
        ligger på en gårdsenhet. Gårdsnummer er nummeret på en gårdsenhet i matrikkelen
        og er unikt innenfor hver kommune. Forkortelsen er gnr
      required: true
    - name: kommunenummer
