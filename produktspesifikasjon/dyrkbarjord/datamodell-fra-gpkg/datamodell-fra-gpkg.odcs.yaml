    required: true
    primaryKey: true
  - name: identifikasjon_lokalId
    logicalType: string
    required: true
  - name: identifikasjon_navnerom
    logicalType: string
    required: true
  - name: informasjon
    logicalType: string
    required: true
  - name: kopidata_kopidato
