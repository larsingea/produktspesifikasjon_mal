    required: true
  - name: kopidata_områdeId
    logicalType: integer
    required: true
  - name: kopidata_originalDatavert
    logicalType: string
    required: true
  - name: dyrkbarJord
    logicalType: string
    required: true
  - name: fulldyrka2008
    logicalType: string
    required: true
  - name: myrTorv
    logicalType: string
    required: true
