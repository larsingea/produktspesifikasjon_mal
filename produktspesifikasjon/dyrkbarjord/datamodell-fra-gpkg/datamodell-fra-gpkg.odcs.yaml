    logicalType: string
    required: true
  - name: årsversjon
    logicalType: integer
    required: true
- name: ArealressursGrense
  physicalName: arealressursgrense
  logicalType: object
  physicalType: table
  description: 'avgrensing for en eller to arealressursflater

    -- Definition --

    delimitation for one or two area resource surfaces'
  customProperties:
  - property: sosiObjektType
    value: ArealressursGrense
  - property: defaultCrs
    value: EPSG:25833
