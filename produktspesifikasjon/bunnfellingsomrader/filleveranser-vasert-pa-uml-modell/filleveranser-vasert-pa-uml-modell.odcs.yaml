      - value: Meget lav posisjonell- og tematisk nøyaktighet, sterkt generalisert
        label: Beregnet for oversiktskart i meget små målestokker. Minste arealenhet
          er ca. 1000 dekar. Anvendelsesområdet er landsoversikter og oversikt over
