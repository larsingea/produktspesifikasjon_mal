          label: 'Genererte data: Generalisering'
        - value: 'Genererte data: Sentralpunkt'
          label: 'Genererte data: Sentralpunkt'
        - value: 'Genererte data: Sammenknytningspunkt, randpunkt'
          label: 'Genererte data: Sammenknytningspunkt (f.eks mellom ulike kartlegginger),
            randpunkt (f.eks mellom ulike kilder til kart)'
        - value: Koordinater hentet fra GAB
          label: Koordinater hentet fra GAB, forløperen til registerdelen av matrikkelen
        - value: Koordinater hentet fra JREG
          label: Koordinater hentet fra JREG, jordregisteret
        - value: Beregnet
          label: Beregnet, uspesifisert hvordan
        - value: Spesielle metoder
          label: Spesielle metoder, uspesifisert
        - value: 'Spesielle metoder: Målt med stikkstang'
          label: 'Spesielle metoder: Målt med stikkstang'
        - value: 'Spesielle metoder: Målt med waterstang'
          label: 'Spesielle metoder: Målt med waterstang'
        - value: 'Spesielle metoder: Målt med målehjul'
          label: 'Spesielle metoder: Målt med målehjul'
        - value: 'Spesielle metoder: Målt med stigningsmåler'
          label: 'Spesielle metoder: Målt med stigningsmåler'
        - value: Fastsatt punkt
          label: Punkt fastsatt ut fra et grunnlag (kart, bilde), f.eks ved partenes
