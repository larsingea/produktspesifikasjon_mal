        - value: 'Digitaliseringbord: Flybilde, fotokopi'
          label: Geometri overført fra flybilde ved hjelp av manuell registrering
            på et digitaliseringsbord. Bildemedium er fotokopi
        - value: Digitalisert på skjerm fra ortofoto
          label: Geometri overført fra ortofoto ved hjelp av manuell registrering
            på skjerm
        - value: Digitalisert på skjerm fra satellittbilde
          label: Geometri overført fra satellittbilde ved hjelp av manuell registrering
            på skjerm
        - value: Digitalisert på skjerm fra andre digitale rasterdata
          label: Digitalisert på skjerm fra andre digitale rasterdata
        - value: Digitalisert på skjerm fra tolkning av seismikk
          label: Digitalisert på skjerm fra tolkning av seismikk
        - value: Vektorisering av laserdata
          label: Vektorisering fra laserdata, brukes også der vektoriseringen støttes
            av ortofoto
        - value: 'Digitaliseringsbord: Kart'
          label: Geometri overført fra kart ved hjelp av manuell registrering på et
            digitaliseringsbord, medium uspesifisert
        - value: 'Digitaliseringsbord: Kart, blyantoriginal'
          label: Geometri overført fra kart ved hjelp av manuell registrering på et
