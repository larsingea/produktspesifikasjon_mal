        - value: Flybåren laserscanner
          label: Målt med laserskanner fra fly
        - value: Bilbåren laser
          label: Målt med laserskanner plassert i kjøretøy
        - value: Lineær referanse
          label: brukes for objekter som er stedfestet med lineær referanse, enten
            disse leveres med stedfesting kun som lineære referanser, eller med koordinatgeometri
            avledet fra lineære referanser
        - value: 'Digitaliseringbord: Ortofoto eller flybilde'
          label: Geometri overført fra ortofoto eller flybilde ved hjelp av manuell
