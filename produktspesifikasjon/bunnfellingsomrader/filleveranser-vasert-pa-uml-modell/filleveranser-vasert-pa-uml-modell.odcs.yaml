    logicalType: string
    logicalTypeOptions:
      pattern: ^(Høyest\ mulig\ posisjonell\ og\ tematisk\ nøyaktighet|Høy\ posisjonell\-\
        og\ tematisk\ nøyaktighet,\ høy\ oppløsning,\ lite\ generalisering|God\ posisjonell\-\
        og\ tematisk\ nøyaktighet,\ god\ oppløsning,\ noe\ generalisert|Lav\ posisjonell\-\
