          label: Annet (spesifiseres i filhode)
        - value: Frihåndstegning
          label: Digitalisert ut fra frihåndstegning.  Frihåndstegning er basert på
            svært grovt grunnlag eller ikke noe grunnlag
        - value: Frihåndstegning på kart
          label: Digitalisert fra krokering på kart, dvs grovt skissert på kart
        - value: Frihåndstegning på skjerm
          label: Digitalisert ut fra frihåndstegning (direkte på skjerm). Frihåndstegning
