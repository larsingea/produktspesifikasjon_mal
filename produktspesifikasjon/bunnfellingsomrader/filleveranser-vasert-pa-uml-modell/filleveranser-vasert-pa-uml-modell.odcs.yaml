        på\ backscatter\ data/sidescan\.sonar|Avgrensning\ basert\ på\ prøvetaking\
        og\ akustiske\ data/metoder|Avgrensning\ basert\ på\ akustiske\ data/metoder|Avgrensning\
        basert\ på\ flere\ metoder/datatyper|Avgrensning\ basert\ på\ undervannsfoto\
        og/eller\ \-video|Aavgrensning\ basert\ på\ akustiske\ data/metoder\ verifisert\
        ved\ prøvetaking,\ foto\ o\.l\.|Avgrensningen\ er\ foretatt\ ut\ fra\ tolkning\
        basert\ på\ tilgjengelige\ batymetriske\ data\ \(varierende\ oppløsning\),\
        litteratur\ og\ kart|Avgrensning\ basert\ på\ Lidardata,\ flyfoto\ og/eller\
        multi\-/hyperspektrale\ bilder\ og\ eksisterende\ geologisk\ informasjon|Avgrensning\
        basert\ på\ romlig\ modellering\ med\ utgangspunkt\ i\ detaljerte\ dybdedata|Avgrensning\
        basert\ på\ romlig\ modellering\ med\ utgangspunkt\ i\ detaljerte\ dybdedata,\
        prøvetaking\ samt\ fysiske\ datasett\ som\ strøm,\ bølger,\ eksponering\ og\
        lysforhold)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ikke spesifisert
        label: Ikke spesifisert
      - value: Sikker påvisning/observasjon
        label: Avgrensningen eller registreringen av objektet er påvist eller observert
