        sterkt\ generalisert)$
    customProperties:
    - property: allowedValues
      value:
      - value: Høyest mulig posisjonell og tematisk nøyaktighet
        label: 'Den geologiske observasjonen/registreringen er stedfestet med høyest
          mulig posisjonell og tematisk nøyaktighet for direkte bruk i kommunenes
          reguleringsplaner (Målestokk under 1:20.000)


          -- Definition --

          The geological observation/registration is georeferenced with the highest
          possible positional and thematic accuracy for direct use in municipal development
          plans (Scale under 1:20.000)'
      - value: Høy posisjonell- og tematisk nøyaktighet, høy oppløsning, lite generalisering
        label: 'Registrering basert på det som for naturinformasjon må anses å være
          av høy posisjonell- og tematisk nøyaktighet (+/- 20 m). Høy oppløsning og
          lite generalisering. Kan anvendes i kommuneplanens arealdel. Minste arealenhet
          er 0.5-1 dekar (~M 1: 20.000)'
      - value: God posisjonell- og tematisk nøyaktighet, god oppløsning, noe generalisert
        label: Registrering stedfestet med nøyaktighet i terrenget på +/- 50m, akseptabelt
          for oversiktsinformasjon på kommunenivå (arealplan). Minste arealenhet er
          ca. 2 dekar for viktige tema, ca. 5 dekar for øvrige (~M 1:50.000)
      - value: Lav posisjonell- og tematisk nøyaktighet, lav oppløsning, med generalisering
        label: Registrering med lav oppløsning (+/- 100 m) og hvor det er gjort generalisering,
          ofte basert på flyfototolkning. Minste gjengitte arealenhet ca. 10 dekar
          for viktige tema, ca 20 dekar for de øvrige. Kan med forbehold benyttes
          som oversiktsinformasjon på kommunenivå (~M 1:100.000)
      - value: Meget lav posisjonell- og tematisk nøyaktighet, meget lav oppløsning,
          stor grad generalisert
        label: Registrering basert på oversiktskartlegging i liten målestokk. Meget
          lav oppløsning (+/- 250 m) og kan inneholde stor grad av generalisering.
          Minste arealenhet er ca. 60 dekar. Bør kun anvendes til regionale oversikter
          (~M 1:250.000)
      - value: Meget lav posisjonell- og tematisk nøyaktighet, sterkt generalisert
        label: Beregnet for oversiktskart i meget små målestokker. Minste arealenhet
          er ca. 1000 dekar. Anvendelsesområdet er landsoversikter og oversikt over
          store regioner (~M > 250.000).
    description: 'kvaliteten på registrering/kartlegging av tema sett i forhold til
      faktiske forhold i naturen. Ulik tematisk oppløsning/generaliseringsgrad kan
      være styrt av temaets samfunnsmessige betydning, områdets arealmessige betydning
      eller prosjektets økonomi. Med nøyaktighet i denne sammenheng menes hvor korrekt
      registreringen avspeiler objektets posisjon i naturen og presisjonen i valg
      av tematisk innhold i forhold til generalisering


      Merknad: Tematisk oppløsning/generaliseringsgrad kan være styrt av temaets samfunnsmessige
      betydning, områdets arealmessige betydning eller prosjektets målsetning'
