        label: Avgrensning basert på geologisk observasjon i felt, prøvetaking og
          analyser
      - value: Tolket avgrensning basert på tilgjengelig geologisk kartlegging
        label: Tolket avgrensning basert på tilgjengelig geologisk kartlegging
      - value: Avgrensning basert på prøvetaking
        label: Avgrensning basert på prøvetaking
      - value: Avgrensning basert på seismikk
        label: Avgrensning basert på seismikk
      - value: Avgrensning basert på detaljerte dybdedata
        label: Avgrensning ved bruk av multistråleekkolodd eller interferometrisk
