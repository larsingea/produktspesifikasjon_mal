      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    - name: målemetodeNavn
      logicalType: string
      description: navn på metode for måling i grunnriss (x,y), og høyde (z) når metoden
        er den samme som ved måling i grunnriss
      required: true
    - name: nøyaktighet
      logicalType: integer
      description: 'punktstandardavviket i grunnriss for punkter samt tverravvik for
        linjer


        Merknad:

        Oppgitt i cm'
    description: 'beskrivelse av kvaliteten på stedfestingen


      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
    required: true
  - name: medium
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Alltid\ i\ vann|I\ bygning/bygningsmessig\ anlegg|I\ luft|På\ isbre|På\
        sjøbunnen|På\ terrenget/på\ bakkenivå|På\ vannoverflaten|Tidvis\ under\ vann|Under\
        isbre|Under\ sjøbunnen|Under\ terrenget|Ukjent)$
    customProperties:
    - property: allowedValues
      value:
      - value: Alltid i vann
        label: Alltid i vann
      - value: I bygning/bygningsmessig anlegg
        label: I bygning/bygningsmessig anlegg
      - value: I luft
        label: I luft
      - value: På isbre
        label: På isbre
      - value: På sjøbunnen
        label: På sjøbunnen
      - value: På terrenget/på bakkenivå
        label: default
      - value: På vannoverflaten
        label: På vannoverflaten
      - value: Tidvis under vann
        label: Tidvis under vann
      - value: Under isbre
        label: Under isbre
      - value: Under sjøbunnen
        label: Under sjøbunnen
      - value: Under terrenget
        label: Under terrenget
      - value: Ukjent
        label: ukjent
    description: 'objektets beliggenhet i forhold til jordoverflaten


      Eksempel:

      På bro, i tunnel, inne i et bygningsmessig anlegg, etc.'
    required: true
  - name: opphav
    logicalType: string
    description: 'referanse til opphavsmaterialet, kildematerialet, organisasjons/publiseringskilde


      Merknad:

      Kan også beskrive navn på person og årsak til oppdatering'
    required: true
  - name: geolPavisningstype
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ikke\ spesifisert|Sikker\ påvisning/observasjon|Usikker\ påvisning/observasjon|Konstruert\
