        - value: 'Digitaliseringsbord: Kart, transparent foile, mindre god kvalitet'
          label: Geometri overført fra kart ved hjelp av manuell registrering på et
            digitaliseringsbord. Kartmedium er transparent folie av mindre god kvalitet,
            samkopi
        - value: 'Digitaliseringsbord: Kart, papirkopi'
          label: Geometri overført fra kart ved hjelp av manuell registrering på et
            digitaliseringsbord. Kartmedium er papirkopi
        - value: Digitalisert på skjerm fra skannet kart
          label: Geometri overført fra kart ved hjelp av manuell registrering på skjerm,
