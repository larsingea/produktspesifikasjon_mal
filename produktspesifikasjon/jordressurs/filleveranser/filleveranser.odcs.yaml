# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:jordressurser-filleveranser:1.0.0
version: 1.0.0
status: active
name: Jordressurser - Filleveranser
schema:
- name: JordressursGrense
  physicalName: jordressursgrense
  logicalType: object
  physicalType: table
  description: 'avgrensing for en eller to arealressursflater

    -- Definition --

    delimitation for one or two area resource surfaces'
  customProperties:
  - property: sosiObjektType
    value: JordressursGrense
  properties:
  - name: grense
    logicalType: object
    physicalType: geometry(LineString)
    required: true
    customProperties:
    - property: geometryType
      value: LineString
- name: Jordressurser_Fellesgenskaper
  physicalName: jordressurser_fellesgenskaper
  logicalType: object
  physicalType: table
  description: 'abstrakt objekttype som bærer sentrale egenskaper som er anbefalt
    for bruk i produktspesifikasjoner.

    Merknad: Disse egenskapene skal derfor ikke modelleres inn i fagområdemodeller.'
  customProperties:
  - property: sosiObjektType
    value: Jordressurser_Fellesgenskaper
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt


        Merknad: Det er dataleverendørens ansvar å sørge for at den lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt, anbefales
        å være en http-URI


        Eksempel: http://data.geonorge.no/SentraltStedsnavnsregister/1.0


        Merknad : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og må være registrert i data.geonorge.no eller
        data.norge.no'
      required: true
    - name: versjonId
      logicalType: string
      description: identifikasjon av en spesiell versjon av et geografisk objekt (instans)
    description: 'Unik identifikasjon av et objekt i et datasett, forvaltet av den
      ansvarlige produsent/forvalter, og kan benyttes av eksterne applikasjoner som
      stabil referanse til objektet.

      Merknad 1: Denne objektidentifikasjonen må ikke forveksles med en tematisk objektidentifikasjon,
      slik som f.eks bygningsnummer.

      Merknad 2: Denne unike identifikatoren vil ikke endres i løpet av objektets
      levetid, og ikke gjenbrukes i andre objekt.'
    required: true
  - name: kopidata
    logicalType: object
    properties:
    - name: områdeId
      logicalType: integer
      description: 'identifikasjon av område som dataene dekker


        Merknad: Kan angis med kommunenummer eller fylkesnummer. Disse bør spesifiseres
        nærmere.'
      required: true
    - name: originalDatavert
      logicalType: string
      description: ansvarlig etat for forvaltning av data
      required: true
    - name: kopidato
      logicalType: timestamp
      description: 'dato når objektet ble kopiert fra originaldatasettet


        Merknad:

        Er en del av egenskapen Kopidata. Brukes i de tilfeller hvor en kopidatabase
        brukes til distribusjon.

        Å kopiere et datasett til en kopidatabase skal ikke føre til at Oppdateringsdato
        blir endret.

        Eventuell redigering av data i et kopidatasett medfører ny Oppdateringsdato,
        Datafangstdato og/eller Verifiseringsdato.'
      required: true
    description: 'angivelse av at objektet er hentet fra en kopi av originaldata

      Merknad:

      Kan benyttes dersom man gjør et uttak av en database som ikke inneholder originaldataene.'
    required: true
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/generelle-konsepter/4.5/m%C3%A5lemetodekode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Målemetode
      - property: asDictionary
        value: 'true'
      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    description: 'beskrivelse av kvaliteten på stedfestingen

      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
  - name: verifiseringsdato
    logicalType: timestamp
    required: true
- name: Jordressurser
  physicalName: jordressurser
  logicalType: object
  physicalType: table
  description: '<b>Definisjon:</b> geografisk område med tilnærmet enhetlige egenskaper
    i de kriteriene som benyttes i rangering av jordkartlagte arealer for datasettet

    — Definition —

    Geographic area with approximately uniform characteristics in the dataset'
  customProperties:
  - property: sosiObjektType
    value: Jordressurser
  - property: inheritsFrom
    value: Jordressurser_Fellesgenskaper
  - property: associations
    value:
    - role: avgrensesAvJordressursgrense
      target: JordressursGrense
      cardinality: 0..*
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt


        Merknad: Det er dataleverendørens ansvar å sørge for at den lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt, anbefales
        å være en http-URI


        Eksempel: http://data.geonorge.no/SentraltStedsnavnsregister/1.0


        Merknad : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og må være registrert i data.geonorge.no eller
        data.norge.no'
      required: true
    - name: versjonId
      logicalType: string
      description: identifikasjon av en spesiell versjon av et geografisk objekt (instans)
    description: 'Unik identifikasjon av et objekt i et datasett, forvaltet av den
      ansvarlige produsent/forvalter, og kan benyttes av eksterne applikasjoner som
      stabil referanse til objektet.

      Merknad 1: Denne objektidentifikasjonen må ikke forveksles med en tematisk objektidentifikasjon,
      slik som f.eks bygningsnummer.

      Merknad 2: Denne unike identifikatoren vil ikke endres i løpet av objektets
      levetid, og ikke gjenbrukes i andre objekt.'
    required: true
  - name: kopidata
    logicalType: object
    properties:
    - name: områdeId
      logicalType: integer
      description: 'identifikasjon av område som dataene dekker


        Merknad: Kan angis med kommunenummer eller fylkesnummer. Disse bør spesifiseres
        nærmere.'
      required: true
    - name: originalDatavert
      logicalType: string
      description: ansvarlig etat for forvaltning av data
      required: true
    - name: kopidato
      logicalType: timestamp
      description: 'dato når objektet ble kopiert fra originaldatasettet


        Merknad:

        Er en del av egenskapen Kopidata. Brukes i de tilfeller hvor en kopidatabase
        brukes til distribusjon.

        Å kopiere et datasett til en kopidatabase skal ikke føre til at Oppdateringsdato
        blir endret.

        Eventuell redigering av data i et kopidatasett medfører ny Oppdateringsdato,
        Datafangstdato og/eller Verifiseringsdato.'
      required: true
    description: 'angivelse av at objektet er hentet fra en kopi av originaldata

      Merknad:

      Kan benyttes dersom man gjør et uttak av en database som ikke inneholder originaldataene.'
    required: true
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/generelle-konsepter/4.5/m%C3%A5lemetodekode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Målemetode
      - property: asDictionary
        value: 'true'
      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    description: 'beskrivelse av kvaliteten på stedfestingen

      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
  - name: verifiseringsdato
    logicalType: timestamp
    required: true
  - name: område
    logicalType: object
    physicalType: geometry(Surface)
    required: true
    customProperties:
    - property: geometryType
      value: Surface
  - name: jordressursklasse
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Svært\ gode\ jordressuser|Gode\ jordressurser|Middels\ gode\ jordressurser|Mindre\
        gode\ jordressurser)$
    customProperties:
    - property: allowedValues
      value:
      - value: Svært gode jordressuser
        label: Jord og areal som er lettdrevet. I tilfelle to jordtyper er registrert,
          kan den mindre dominerende jordtypen ha andre egenskaper.
      - value: Gode jordressurser
        label: Jord og areal som er nokså lettdrevet men krever noe større innsats
          enn jord og areal i klasse 1. Hvis to jordtyper er registrert kan den mindre
          dominerende jordtypen ha andre egenskaper. Avhengig av jordegenskaper klassifiseres
          stein og blokkholdige arealer arealer med helling 25 prosent til under 33
          prosent og arealer med tegn til forstyrrelser utover vanlig jordbearbeiding
          eller grøfting i denne klassen.
      - value: Middels gode jordressurser
        label: jord og areal som setter større krav til innsats enn jord og areal
          i klasse 2 og 3. I tilfelle to jordtyper er registrert kan den mindre dominerende
          jordtypen ha andre egenskaper. Avhengig av jordegenskaper klassifiseres
          stein og blokkholdige arealer samt hyppig forekommende fjell i dagen og
          arealer med helling 25 prosent til under 33 prosent i denne klassen.
      - value: Mindre gode jordressurser
        label: 'Jord og areal som har ugunstige egenskaper som det er vanskelig å
          få gjort noe med.

          I tilfelle jordtypene er registrert kan den mindre dominerende jordtypen
          ha andre egenskaper.

          Avhengig av jordeegenskaper klassifiseres stein og blokkholdige eller stein
          og blokkholdige arealer hyppig forekommende fjell i dagen og arealer med
          helling 33 prosent i denne klassen.'
    description: 'Viser arealets klassetilhørighet i Jordressurser

      — Definition —

      Shows the Soil Resource Class for an area'
    required: true
  - name: hellingGjsnitt
    logicalType: string
    logicalTypeOptions:
      pattern: ^(0\ \-\ 25\ %|≥\ 25\ \-\ 33\ %|≥\ 33\ %)$
    customProperties:
    - property: allowedValues
      value:
      - value: 0 - 25 %
        label: 'Mindre enn 25 % gjennomsnittlig helling. Har ikke betydning for maskinvalg
          eller jordarbeiding

          -- Definition --

          Less than25 % inclination. Not significant for choice of machinery or tillage.'
      - value: ≥ 25 - 33 %
        label: 'Mellom 25 og opp til 33 % gjennomsnittlig helling, Maskinvalg og jordarbeiding
          begrenses noe

          -- Definition --

          Between 25% and less than 33 %  average inclination. Choice of machinery
          and tillage is limited.'
      - value: ≥ 33 %
        label: '33 % eller mer gjennomsnittlig helling. Maskinvalg og jordarbeiding
          begrenses sterkt.

          -- Definition --

          33 % or more  average inclination. Choice of machinery and tillage is strongly
          limited.'
    description: 'Viser gjennomsnittlige helling på arealet.

      -- Definition - -

      Average inclination class of the soil figure'
    required: true
  - name: steinblokk
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ikke\ registrert|Ingen\ eller\ noe\ stein\ og\ blokk|Stein\ og\ blokkholdig|Stein\
        og\ blokkrik)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ikke registrert
        label: Ikke registrert stein og blokk.
      - value: Ingen eller noe stein og blokk
        label: Lite eller ingen stein og blokk.
      - value: Stein og blokkholdig
        label: Inneholder stein og blokk.
      - value: Stein og blokkrik
        label: Inneholder mye stein og blokk.
    description: 'Viser stein- og blokkinnhold (0–50 cm) på arealet på kartleggingstidspunktet
      — — Definition —

      Shows the amount of stones and boulders for the soil figure in the upper 50
      cm'
    required: true
  - name: årsakTilNedklassifisering
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Jordegenskaper|Helling|Jordegenskaper\ og\ helling|Hyppig\ forekommende\
        fjell\ i\ dagen|Innhold\ av\ stein\ og\ blokk|Deler\ av\ arealet\ har\ organisk\
        jord,\ har\ liten\ evne\ til\ å\ bli\ kvitt\ overflødig\ vann,\ er\ bakkeplanert\
        eller\ forstyrret\ av\ graving\ eller\ påfylling|Ingen\ nedklassifisering)$
    customProperties:
    - property: allowedValues
      value:
      - value: Jordegenskaper
        label: Jorda har egenskaper som gjør at arealet krever større innsats i drift
      - value: Helling
        label: Arealet har en gjennomsnittlig helling på enten 25 til under 33 prosent
          eller 33 prosent og over. Dette gir driftsutfordringer
      - value: Jordegenskaper og helling
        label: Jorda har egenskaper som gjør at arealet krever større innsats i drift
          og arealet har en gjennomsnittlig helling på 25 prosent og over til under
          33 prosent
      - value: Hyppig forekommende fjell i dagen
        label: Arealet har mer enn 4 fjellblotninger / fjell i dagen per 10 daa og
          dette gir driftsutfordringer
      - value: Innhold av stein og blokk
        label: Arealet er enten stein- og blokkholdig eller stein- og blokkrikt og
          dette gir driftsutfordringer
      - value: Deler av arealet har organisk jord, har liten evne til å bli kvitt
          overflødig vann, er bakkeplanert eller forstyrret av graving eller påfylling
        label: Deler av arealet har egenskaper utover dem som er registrert som egenskaper
          ved jordtypene og disse gir driftsutfordringer
      - value: Ingen nedklassifisering
        label: Arealet har ingen årsak til nedklassifisering
    description: 'Viser årsak til at kartfiguren er nedklassifisert

      — Definition —

      Reason for down-classification of Soil Resource Class'
    required: true
  - name: tilleggsinformasjon
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Deler\ av\ arealet\ er\ bakkeplanert|Deler\ av\ arealet\ er\ forstyrret\
        av\ graving\ eller\ fyllmateriale|Ingen|Deler\ av\ arealet\ er\ organisk\
        jord|Deler\ av\ arealet\ er\ preget\ av\ vannmetning|Deler\ av\ arealet\ er\
        mineraljord|Hyppig\ forekommende\ fjell\ i\ dagen)$
    customProperties:
    - property: allowedValues
      value:
      - value: Deler av arealet er bakkeplanert
        label: Deler av arealet er bakkeplanert
      - value: Deler av arealet er forstyrret av graving eller fyllmateriale
        label: Deler av arealet er forstyrret av graving eller fyllmateriale.
      - value: Ingen
        label: Ingen forstyrrelser.
      - value: Deler av arealet er organisk jord
        label: Deler av arealet er organisk jord
      - value: Deler av arealet er preget av vannmetning
        label: Deler av arealet er preget av vannmetning.
      - value: Deler av arealet er mineraljord
        label: Deler av arealet er mineraljord
      - value: Hyppig forekommende fjell i dagen
        label: Hyppig forekommende fjell i dagen
    description: 'Viser tilleggsinformasjon om andre egenskaper ved arealet

      — Definition —

      Supplementary information'
    required: true
  - name: kartleggingsår
    logicalType: integer
    description: 'Viser hvilket år kartfiguren ble jordkartlagt

      — Definition —

      Mapping year'
    required: true
  - name: kartleggingsmetodikk
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Detaljert\ kartlegging|Forenklet\ kartlegging|Harmonisert\ kartlegging)$
    customProperties:
    - property: allowedValues
      value:
      - value: Detaljert kartlegging
        label: Feltbasert kartlegging med avgrensning av jordtyper direkte inn på
          digitale flybilder i felt, basert på en kombinasjon av borstikk ned til
          en meters dybde, flybildetolking og GPS. I tillegg deles arealene inn på
          bakgrunn av terrengegenskaper som helling og stein- og blokkinnhold.
      - value: Forenklet kartlegging
        label: Feltbasert kartlegging med en grovere inndeling av jorda enn detaljert
          kartlegging, der en i tillegg slår sammen enkelte hellingsklasser og ser
          bort i fra andre egenskaper ved terrenget
      - value: Harmonisert kartlegging
        label: Feltbasert kartlegging som kombinerer det beste fra de tidligere metodikkene
          (detaljert og forenklet).
    description: 'Viser hvilken kartleggingsmetodikk som ble brukt da kartfiguren
      ble jordkartlagt

      — Definition —

      Original mapping method'
    required: true
  - name: opprinneligLokalId
    logicalType: integer
    description: 'Opprinnelig id i databasen

      — Definition —

      Original ID in the soil database'
    required: true
